name: CI

on:
  push:
    branches: [ main, develop, 'fix/*', 'feature/*' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Run standard tests
      run: npm test -- --watchAll=false --coverage
    
    - name: Run performance tests
      run: npm run test:performance
      timeout-minutes: 5
    
    - name: Check bundle size
      run: |
        npm run build
        npm run size
    
    - name: Upload coverage reports
      if: matrix.node-version == '20.x'
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage/lcov.info
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
    
    - name: Comment on PR with bundle sizes
      if: github.event_name == 'pull_request' && matrix.node-version == '20.x'
      uses: actions/github-script@v6
      with:
        script: |
          const fs = require('fs');
          const { execSync } = require('child_process');
          
          // Get bundle size output
          const sizeOutput = execSync('npm run size', { encoding: 'utf-8' });
          
          // Extract key metrics
          const mainJsMatch = sizeOutput.match(/Main JS Bundle[\s\S]*?Size:\s*([^\n]+)/);
          const cssMatch = sizeOutput.match(/CSS Bundle[\s\S]*?Size:\s*([^\n]+)/);
          const totalMatch = sizeOutput.match(/Total Bundle Size[\s\S]*?Size:\s*([^\n]+)/);
          
          const comment = `## 📦 Bundle Size Report
          
          | Bundle | Size |
          |--------|------|
          | Main JS | ${mainJsMatch ? mainJsMatch[1] : 'N/A'} |
          | CSS | ${cssMatch ? cssMatch[1] : 'N/A'} |
          | **Total** | **${totalMatch ? totalMatch[1] : 'N/A'}** |
          
          ✅ All bundles within size limits`;
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          });